name: CI Workflow - Build & Test Debian Package

on:
  push:
    branches:
      - "main"
      - "part*"
      - "feature/**"
  pull_request:
    branches:
      - "main"
      - "part*"
      - "feature/**"
  workflow_dispatch:

jobs:
  build-and-test-deb:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER:  ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD:  ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB:  ${{ secrets.DB_NAME }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --shm-size=256mb
        ports:
          - 5432:5432

    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint with flake8
        run: |
          flake8 apps tests

      - name: Verify PostgreSQL connection
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U "$DB_USER"; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

          echo "Testing direct connection..."
          PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -U "$DB_USER" -d "$DB_NAME" -c "SELECT version();"

      - name: Initialize database and start orders app
        run: |
          set -euo pipefail
          export PYTHONUNBUFFERED=1
          echo "Starting orders application to initialize database..."
          export PYTHONPATH="${PWD}:${PYTHONPATH:-}"

          # Start orders app in background, unbuffered, capture logs
          nohup python -u apps/main.py > orders_app.log 2>&1 &
          ORDERS_APP_PID=$!
          echo "Orders app started with PID: $ORDERS_APP_PID"

          # Give the server a moment and print initial logs for quick feedback
          sleep 3
          echo "=== orders_app.log (head) ==="
          head -n 200 orders_app.log || true

          # Wait for orders app to be ready (health endpoint)
          echo "Waiting for orders app to be ready..."
          READY=0
          for i in {1..30}; do
            if curl -sS http://127.0.0.1:5000/health >/dev/null 2>&1; then
              echo "Orders app is ready!"
              READY=1
              break
            fi
            echo "Waiting for orders app... ($i/30)"
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Orders app did not become ready in time. Dumping orders_app.log:"
            tail -n 400 orders_app.log || true
            exit 1
          fi

          # Verify orders app is running
          curl -v http://127.0.0.1:5000/health || (echo "Orders app health check failed" && tail -n 400 orders_app.log && exit 1)

          echo "Checking /orders (integration test)..."
          # GET /orders should respond 200
          curl -v http://127.0.0.1:5000/orders || (echo "/orders check failed" && tail -n 400 orders_app.log && exit 1)
          # Optional: POST an order and then GET again to verify persistence
          curl -X POST -H "Content-Type: application/json" \
               -d '{"id": "ci-test-1", "amount": 123.45}' \
               http://127.0.0.1:5000/orders || (echo "POST /orders failed" && tail -n 400 orders_app.log && exit 1)
          curl -v http://127.0.0.1:5000/orders || (echo "GET /orders after POST failed" && tail -n 400 orders_app.log && exit 1)

          # Keep orders app PID for later
          echo $ORDERS_APP_PID > orders_app.pid

      - name: Run tests with coverage (generate htmlcov)
        run: |
          export PYTHONPATH="${PWD}:${PYTHONPATH:-}"
          pytest tests/ \
            --cov=apps \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            -v

      - name: Validate htmlcov/index.html exists
        if: always()
        run: |
          if [ -d htmlcov ] && [ -s htmlcov/index.html ]; then
            echo "htmlcov/index.html exists and is non-empty"
          else
            echo "ERROR: htmlcov/index.html is missing or empty. pytest may have failed to generate the report."
            echo "List htmlcov contents (if any):"
            ls -la htmlcov || true
            exit 1
          fi

      - name: Create single zip of htmlcov
        run: |
          rm -f coverage-html.zip
          zip -r coverage-html.zip htmlcov

      - name: Upload coverage HTML zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-zip
          path: coverage-html.zip
          retention-days: 30

      - name: Collect orders app logs (always)
        if: always()
        run: |
          echo "=== Final orders_app.log (tail) ==="
          tail -n 400 orders_app.log || true

      - name: Upload orders app log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orders_app_log_${{ github.run_id }}
          path: orders_app.log

      - name: Stop orders app
        if: always()
        run: |
          if [ -f orders_app.pid ]; then
            ORDERS_APP_PID=$(cat orders_app.pid)
            echo "Stopping Orders app (PID: $ORDERS_APP_PID)..."
            kill "$ORDERS_APP_PID" || true
            echo "Orders app logs:"
            cat orders_app.log || true
          fi

      - name: Install packaging and systemd tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev systemd python3 python3-pip

      - name: Build .deb package
        run: |
          set -euo pipefail

          mkdir -p debian_package/{DEBIAN,opt/arculus,etc/systemd/system}
          pip install --target=debian_package/opt/arculus -r requirements.txt
          cp -r apps tests debian_package/opt/arculus/

          cat > debian_package/etc/systemd/system/arculus.service << 'EOF'
          [Unit]
          Description=Arculus orders Application
          After=network.target

          [Service]
          User=www-data
          Group=www-data
          WorkingDirectory=/opt/arculus
          ExecStart=/usr/bin/python3 /opt/arculus/apps/main.py
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

          cat > debian_package/DEBIAN/control << 'EOF'
          Package: arculus
          Version: 1.0.0
          Section: base
          Priority: optional
          Architecture: all
          Maintainer: Your Name <your.email@example.com>
          Description: Orders app with /health and /orders endpoints
          EOF

          dpkg-deb --build debian_package

      - name: Test .deb package installation
        run: |
          sudo dpkg -i debian_package.deb || sudo apt-get install -f -y
          if [ -d "/opt/arculus" ]; then
            echo "App installed correctly"
          else
            echo "App installation failed"
            exit 1
          fi
          if [ -f "/etc/systemd/system/arculus.service" ]; then
            echo "Systemd file exists"
          else
            echo "Systemd file missing"
            exit 1
          fi

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: arculus.deb
          path: debian_package.deb
      
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests with kubeconform
        run: |
          set -euo pipefail
          kubeconform -strict -ignore-missing-schemas \
            -summary \
            -schema-location default \
            k8s/*.yaml